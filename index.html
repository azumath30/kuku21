<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- iPadの画面でズームされないように設定し、アプリのような挙動にします -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九 チャレンジ</title>
    <!-- Tailwind CSS を読み込み、スタイリングに使用します -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js を読み込み、音の再生に使用します -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        /* 視認性を高めるためのフォント設定と、タッチ操作の最適化 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #000000; /* 完全な黒背景で高コントラスト化 */
            color: #ffffff;
            touch-action: manipulation; /* ダブルタップズームの防止 */
            user-select: none; /* テキスト選択の防止 */
            -webkit-user-select: none;
            overflow: hidden; /* スクロール防止 */
        }
        
        /* 押したときの沈み込みエフェクト */
        .btn-press:active {
            transform: translateY(8px);
            box-shadow: none !important;
        }

        /* 視認性の高い黄色 */
        .text-high-contrast {
            color: #FFFF00; 
        }

        /* エラー時の画面フラッシュエフェクト */
        @keyframes flashRed {
            0% { background-color: #000; }
            50% { background-color: #4a0000; }
            100% { background-color: #000; }
        }
        .flash-error {
            animation: flashRed 0.3s ease-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col">

    <!-- ================= メニュー画面 ================= -->
    <div id="menu-screen" class="flex flex-col items-center justify-center w-full h-full p-2 space-y-6 md:space-y-8">
        <h1 class="text-4xl md:text-7xl font-bold text-high-contrast tracking-widest text-center mt-4">
            九九にちょうせん！
        </h1>
        <p class="text-2xl md:text-3xl text-gray-300">やりたい段をえらんでね</p>
        
        <!-- 段を選択するボタンのグリッド -->
        <div class="grid grid-cols-3 gap-3 md:gap-6 w-full max-w-3xl px-2">
            <!-- JavaScriptで1〜9のボタンを生成します -->
            <div id="table-buttons" class="contents"></div>
        </div>
    </div>

    <!-- ================= ゲーム画面 ================= -->
    <div id="game-screen" class="hidden flex-col items-center justify-between w-full h-full p-2 md:p-4 max-w-4xl mx-auto">
        
        <!-- ヘッダー部（進行度とタイマー） -->
        <div class="w-full flex justify-between items-center px-4 text-3xl md:text-5xl font-bold text-gray-300 shrink-0 h-[10%]">
            <div id="progress-text">1 / 9</div>
            <div id="timer-text" class="text-cyan-400 font-mono tracking-wider">0.00</div>
        </div>

        <!-- 問題表示部（極大サイズ、残り高さを埋める） -->
        <div class="flex-grow flex flex-col items-center justify-center w-full min-h-0">
            <div id="question-text" class="text-[15vh] md:text-[20vh] font-bold text-high-contrast tracking-widest drop-shadow-2xl leading-none whitespace-nowrap">
                3 × 4
            </div>
            
            <!-- 入力された数字の表示枠 -->
            <div class="mt-4 md:mt-8 h-20 md:h-28 flex items-center justify-center border-b-4 md:border-b-8 border-gray-600 min-w-[150px] md:min-w-[250px]">
                <span id="input-text" class="text-6xl md:text-8xl font-bold text-white tracking-widest"></span>
            </div>
        </div>

        <!-- 電卓風テンキー (画面下部、高さを固定割合に) -->
        <div class="w-full shrink-0 h-[45vh] grid grid-cols-3 gap-2 md:gap-4 pb-2">
            <!-- 数字ボタン (7,8,9, 4,5,6, 1,2,3, C,0,消) -->
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="7">7</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="8">8</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="9">9</button>
            
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="4">4</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="5">5</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="6">6</button>
            
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="1">1</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="2">2</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="3">3</button>
            
            <button id="btn-clear" class="btn-press bg-red-900 border-4 border-red-700 rounded-2xl md:rounded-3xl h-full text-4xl md:text-6xl font-bold text-red-200 shadow-[0_6px_0_0_#7f1d1d] md:shadow-[0_10px_0_0_#7f1d1d]">クリア</button>
            <button class="numpad-btn btn-press bg-gray-800 border-4 border-gray-600 rounded-2xl md:rounded-3xl h-full text-5xl md:text-7xl font-bold shadow-[0_6px_0_0_#4b5563] md:shadow-[0_10px_0_0_#4b5563]" data-num="0">0</button>
            <button id="btn-back" class="btn-press bg-orange-900 border-4 border-orange-700 rounded-2xl md:rounded-3xl h-full text-4xl md:text-6xl font-bold text-orange-200 shadow-[0_6px_0_0_#7c2d12] md:shadow-[0_10px_0_0_#7c2d12]">もどる</button>
        </div>
    </div>

    <!-- ================= 結果画面 ================= -->
    <div id="result-screen" class="hidden flex-col items-center justify-center w-full h-full p-4 space-y-6 md:space-y-8">
        <h2 id="result-title" class="text-6xl md:text-8xl font-bold text-high-contrast">クリア！</h2>
        
        <div class="text-4xl md:text-6xl font-bold">
            タイム: <span id="final-time" class="text-cyan-400 font-mono">12.34</span> 秒
        </div>

        <div class="bg-gray-900 border-4 border-gray-700 rounded-3xl p-4 md:p-8 w-full max-w-2xl mt-4">
            <h3 class="text-3xl md:text-4xl font-bold text-center mb-4 text-gray-300 border-b-2 border-gray-700 pb-2">トップ3のきろく</h3>
            <ul id="ranking-list" class="space-y-2 md:space-y-4 text-3xl md:text-5xl font-mono text-center">
                <!-- JavaScriptでランキングを表示します -->
            </ul>
        </div>

        <button id="btn-return-menu" class="btn-press mt-6 bg-blue-800 border-4 border-blue-600 rounded-2xl md:rounded-3xl px-8 py-4 md:px-12 md:py-6 text-4xl md:text-6xl font-bold shadow-[0_8px_0_0_#1e3a8a]">
            メニューへ
        </button>
    </div>

    <!-- アプリケーションのロジック -->
    <script>
        // --- 状態管理 ---
        let currentTable = 1;
        let questions = [];
        let currentQuestionIndex = 0;
        let currentInput = "";
        
        let startTime = 0;
        let timerAnimationFrame = null;
        
        // 過去のタイム記録 (段ごとに保存)
        const records = {
            1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [], 9: []
        };

        // --- Tone.js (音響) の設定 ---
        let audioInitialized = false;
        let correctSynth, wrongSynth, fanfareSynth;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            // 正解音（ピンポン）- 高音のチャイム風
            correctSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.1 }
            }).toDestination();
            correctSynth.volume.value = 5;

            // 不正解音（ブー）- 低いノコギリ波
            wrongSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 0.1 }
            }).toDestination();
            wrongSynth.volume.value = -5;

            // おめでとう音（ファンファーレ）
            fanfareSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.8 }
            }).toDestination();
            fanfareSynth.volume.value = 2;

            audioInitialized = true;
        }

        function playCorrectSound() {
            if (!audioInitialized) return;
            const now = Tone.now();
            correctSynth.triggerAttackRelease("B4", "16n", now);
            correctSynth.triggerAttackRelease("E5", "8n", now + 0.15);
        }

        function playWrongSound() {
            if (!audioInitialized) return;
            wrongSynth.triggerAttackRelease("G2", "8n");
        }

        function playFanfare() {
            if (!audioInitialized) return;
            const now = Tone.now();
            // ド・ミ・ソ・ド のアルペジオ和音
            fanfareSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
            fanfareSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now + 0.2);
            fanfareSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now + 0.4);
            fanfareSynth.triggerAttackRelease(["E4", "G4", "C5"], "2n", now + 0.6);
        }

        // --- 画面切り替え ---
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');

        function showScreen(screen) {
            menuScreen.classList.add('hidden');
            menuScreen.classList.remove('flex');
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            resultScreen.classList.add('hidden');
            resultScreen.classList.remove('flex');
            
            screen.classList.remove('hidden');
            screen.classList.add('flex');
        }

        // --- メニューの生成 ---
        const tableButtonsContainer = document.getElementById('table-buttons');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = "btn-press bg-green-800 border-4 border-green-600 rounded-2xl md:rounded-3xl py-4 md:py-8 text-4xl md:text-6xl font-bold shadow-[0_6px_0_0_#166534] md:shadow-[0_10px_0_0_#166534]";
            btn.textContent = `${i}の段`;
            btn.onclick = async () => {
                await initAudio(); // ユーザーのアクションでオーディオを許可
                startGame(i);
            };
            tableButtonsContainer.appendChild(btn);
        }

        // --- ゲームロジック ---
        function startGame(tableNumber) {
            currentTable = tableNumber;
            currentInput = "";
            currentQuestionIndex = 0;
            
            // 9問の問題を生成してシャッフル
            questions = [];
            for (let i = 1; i <= 9; i++) {
                questions.push({ a: tableNumber, b: i, answer: tableNumber * i });
            }
            questions.sort(() => Math.random() - 0.5); // ランダムにシャッフル

            showScreen(gameScreen);
            updateQuestionDisplay();
            updateInputDisplay();
            
            // タイマー開始
            startTime = performance.now();
            updateTimer();
        }

        function updateQuestionDisplay() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-text').textContent = `${q.a} × ${q.b}`;
            document.getElementById('progress-text').textContent = `${currentQuestionIndex + 1} / 9`;
        }

        function updateInputDisplay() {
            document.getElementById('input-text').textContent = currentInput;
        }

        // テンキーの入力処理
        function handleNumpadInput(numStr) {
            currentInput += numStr;
            updateInputDisplay();
            checkAnswer();
        }

        function checkAnswer() {
            const correctAnswer = questions[currentQuestionIndex].answer.toString();

            if (currentInput === correctAnswer) {
                // 完全正解
                playCorrectSound();
                currentInput = ""; // 入力をリセット
                currentQuestionIndex++;
                
                if (currentQuestionIndex >= questions.length) {
                    endGame();
                } else {
                    updateQuestionDisplay();
                    updateInputDisplay();
                }
            } else if (!correctAnswer.startsWith(currentInput)) {
                // 間違い（例：答えが12なのに、3を押した。または1を押した後に3を押した）
                playWrongSound();
                // 画面を赤く光らせるエフェクト
                document.body.classList.add('flash-error');
                setTimeout(() => document.body.classList.remove('flash-error'), 300);
                
                currentInput = ""; // 間違えたら自動でクリアし、入力をやり直しやすくする
                updateInputDisplay();
            }
            // 部分一致（例：答えが12で、1だけ押した状態）の場合は何もしない（次の入力を待つ）
        }

        // --- タイマー処理 ---
        function updateTimer() {
            if (gameScreen.classList.contains('hidden')) return; // ゲーム画面外なら停止
            const currentTime = performance.now();
            const elapsed = (currentTime - startTime) / 1000;
            document.getElementById('timer-text').textContent = elapsed.toFixed(2);
            timerAnimationFrame = requestAnimationFrame(updateTimer);
        }

        // --- ゲーム終了処理 ---
        function endGame() {
            cancelAnimationFrame(timerAnimationFrame);
            const endTime = performance.now();
            const finalTime = ((endTime - startTime) / 1000).toFixed(2);
            const timeNumber = parseFloat(finalTime);
            
            // 記録を保存し、昇順（速い順）にソート
            records[currentTable].push(timeNumber);
            records[currentTable].sort((a, b) => a - b);
            
            // トップ3に入ったか判定
            const rankIndex = records[currentTable].indexOf(timeNumber);
            const isTop3 = rankIndex >= 0 && rankIndex < 3;

            // 結果画面の描画
            document.getElementById('final-time').textContent = finalTime;
            
            const titleEl = document.getElementById('result-title');
            if (isTop3) {
                titleEl.textContent = "すごい！トップ3！";
                titleEl.className = "text-6xl md:text-8xl font-bold text-yellow-400 drop-shadow-[0_0_20px_rgba(255,255,0,0.8)]";
                playFanfare(); // トップ3ならファンファーレ
            } else {
                titleEl.textContent = "クリア！";
                titleEl.className = "text-7xl md:text-9xl font-bold text-high-contrast";
            }

            // ランキングリストの生成
            const rankingList = document.getElementById('ranking-list');
            rankingList.innerHTML = ""; // クリア
            for (let i = 0; i < 3; i++) {
                const li = document.createElement('li');
                if (records[currentTable][i] !== undefined) {
                    const recTime = records[currentTable][i].toFixed(2);
                    li.textContent = `${i + 1}位 : ${recTime} 秒`;
                    // 今回の記録をハイライト
                    if (recTime === finalTime) {
                        li.classList.add('text-yellow-300', 'font-extrabold', 'scale-110');
                    } else {
                        li.classList.add('text-gray-300');
                    }
                } else {
                    li.textContent = `${i + 1}位 : -`;
                    li.classList.add('text-gray-600');
                }
                rankingList.appendChild(li);
            }

            showScreen(resultScreen);
        }

        // --- イベントリスナー設定 ---
        
        // 数字ボタンの設定
        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                handleNumpadInput(e.target.dataset.num);
            });
        });

        // クリアボタン（C）
        document.getElementById('btn-clear').addEventListener('click', () => {
            currentInput = "";
            updateInputDisplay();
        });

        // もどるボタン（1文字消去）※今回は自動消去もありますが、手動修正用として
        document.getElementById('btn-back').addEventListener('click', () => {
            currentInput = currentInput.slice(0, -1);
            updateInputDisplay();
        });

        // 結果画面からもどるボタン
        document.getElementById('btn-return-menu').addEventListener('click', () => {
            showScreen(menuScreen);
        });

        // 初期状態はメニューを表示
        showScreen(menuScreen);

    </script>
</body>
</html>
